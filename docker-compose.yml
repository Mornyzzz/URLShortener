version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshort
    ports:
      - "8080:8080"
    environment:
      - CONFIG_FILE=config/config.yaml
      - STORAGE_TYPE=${STORAGE_TYPE:-postgres}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres_db}
      - REDIS_HOST=${REDIS_HOST:-redis_db}
    depends_on:
      - postgres
      - redis


  postgres:
    image: postgres:latest
    container_name: postgres_db
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: url_shortener_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis_db
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

