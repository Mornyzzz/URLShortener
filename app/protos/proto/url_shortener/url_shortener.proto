syntax = "proto3";

package url_shortener;

option go_package = "moiseev.url_shortener.v1;url_shortenerv1";

service UrlShortener {
  rpc Post(PostRequest) returns (PostResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

message PostRequest {
  string url = 1;
}

message PostResponse {
  string alias = 1;
}

message GetRequest {
  string alias = 1;
}

message GetResponse {
  string url = 1;
}